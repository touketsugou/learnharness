name: iOS

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "tests/fixtures/native/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "tests/fixtures/native/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: LHKit and app tests
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - run: sudo xcode-select -s /Applications/Xcode_27.2.app
      # The tests don't render Mermaid, so ios/scripts/vendor-web.sh (and npm ci) is skipped.
      - name: Pick a simulator
        run: |
          udid="$(xcrun simctl list -j devices available | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime, entries in devices.items():
              if ".iOS-" in runtime:
                  for device in entries:
                      if device["name"].startswith("iPhone"):
                          print(device["udid"]); sys.exit()
          sys.exit("No iPhone simulator available.")
          ')"
          echo "SIMULATOR=id=$udid" >> "$GITHUB_ENV"
      - name: LHKit tests
        working-directory: ios/LHKit
        run: xcodebuild -scheme LHKit-Package -destination "$SIMULATOR" test
      - name: App tests
        working-directory: ios
        run: xcodebuild -project LearnHarness.xcodeproj -scheme LearnHarness -destination "$SIMULATOR" test
